# The one release step (see RELEASING.md): run by hand on main right after merging, with minor or patch. It takes
# the next version from the latest vX.Y.Z tag, dates CHANGELOG's [Unreleased] entries as that version under a new
# empty [Unreleased], sets the client's __version__, commits both to main, pushes an annotated tag, and runs the
# release workflow on it. It refuses when [Unreleased] is empty or main's CI hasn't passed on the commit. A tag
# pushed with this job's token starts no workflow, so it calls release.yml itself. It pushes to main directly: with
# branch protection on, it needs a bypass.
name: cut release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "minor for anything new or breaking while 0.x, patch for fixes only"
        type: choice
        options: [minor, patch]
        required: true

permissions:
  contents: read

concurrency:
  group: cut-release

jobs:
  cut:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      tag: ${{ steps.cut.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check main's CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          ci=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push" \
               --jq '[.workflow_runs[] | select(.status == "completed")][0].conclusion // ""')
          [ "$ci" = success ] || { echo "::error::ci on $SHA is '${ci:-not finished}', not success"; exit 1; }
      - name: Date [Unreleased], set __version__, commit and tag
        id: cut
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          latest=$(git tag -l 'v*.*.*' --sort=-v:refname | head -n 1)
          [ -n "$latest" ] || { echo "::error::no vX.Y.Z tag to count from"; exit 1; }
          version=$(python tools/release.py bump "$BUMP" --latest "$latest")
          python tools/release.py check "v$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -am "Release $version"
          git tag -a "v$version" -m "udsota $version"
          git push --atomic origin HEAD:main "v$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  release:
    needs: cut
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.cut.outputs.tag }}
