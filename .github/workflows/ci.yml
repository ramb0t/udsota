# udsota: the host end-to-end test, the client's tests, and the ESP32 example built with a throwaway signing key.
name: ci
on: [push, pull_request]
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build && cmake --build build -j && ctest --test-dir build --output-on-failure
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ./client pytest && python -m pytest -q client/tests
  esp32:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          mkdir -p examples/candash_ws43/secrets
          espsecure.py generate_signing_key --version 2 examples/candash_ws43/secrets/dev_signing_key.pem
          idf.py -C examples/candash_ws43 -B build build
