# udsota: the host test, the client's tests and the release tool's, the client against udsota_lite_server, and the
# ESP32 example built with a throwaway signing key.
name: ci
on: [push, pull_request]
jobs:
  host:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: The vendored iso14229 files match iso14229/SHA256SUMS
        run: cd iso14229 && sha256sum -c SHA256SUMS
      - run: cmake -S . -B build && cmake --build build -j && ctest --test-dir build --output-on-failure
        env:
          CC: ${{ matrix.cc }}
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "./client[diff]" pytest && python -m pytest -q client/tests
      - name: The release tool's tests (they fail unless CHANGELOG and udsota.h agree with the client's __version__)
        run: python -m pytest -q tools/test_release.py && python tools/release.py notes v0.14.2 > /dev/null
      - name: Smoke-test the installed client from outside the tree
        run: cd /tmp && python -c "from udsota import profile; print(profile.load('example'))"
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cmake -S . -B build && cmake --build build -j --target udsota_lite_server && test -x build/udsota_lite_server
      - run: python -m pip install "./client[diff]" pytest && python -m pytest -q -rsx client/tests/test_e2e_lite.py
        env:
          UDSOTA_LITE_SERVER: ${{ github.workspace }}/build/udsota_lite_server
  esp32:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          mkdir -p examples/candash_ws43/secrets
          espsecure.py generate_signing_key --version 2 examples/candash_ws43/secrets/dev_signing_key.pem
          idf.py -C examples/candash_ws43 -B build build
          idf.py -C examples/candash_ws43 -B build-ws43b -DPOC_BOARD=ws43b build
