# Host unit tests, the Python client's tests and the ESP-IDF example build, on every push and pull request.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the host tests (core, isotp, port logic, fuzz corpus)
        run: |
          cmake -S . -B build
          cmake --build build -j
          ctest --test-dir build --output-on-failure

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the client and pytest
        run: python -m pip install ./client pytest
      - name: Run the client tests
        run: python -m pytest -q client/tests
      - name: Smoke-test the installed wheel from outside the tree
        run: |
          cd /tmp
          python -c "from udsota import profile; print(profile.load('example'))"

  esp32:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    strategy:
      matrix:
        target: [esp32s3, esp32]
    steps:
      - uses: actions/checkout@v4
      - name: Build the example for ${{ matrix.target }}
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          b="$PWD/examples/esp32/build/${{ matrix.target }}"
          idf.py -C examples/esp32 -B "$b" -D SDKCONFIG="$b/sdkconfig" set-target ${{ matrix.target }}
          idf.py -C examples/esp32 -B "$b" -D SDKCONFIG="$b/sdkconfig" build 2>&1 | tee "$b.log"
          ! grep -E 'warning:' "$b.log"
      - name: Check the built image passes udsota's first-block check
        shell: bash
        run: |
          case "${{ matrix.target }}" in esp32) chip=0x0000 ;; esp32s3) chip=0x0009 ;; esac
          gcc -std=c11 -Wall -Wextra -Werror -Icomponents/udsota/include -Icomponents/udsota_esp32/include \
              tools/image_check.c components/udsota_esp32/udsota_esp32_image.c components/udsota/udsota_image.c \
              -o /tmp/image_check
          /tmp/image_check "examples/esp32/build/${{ matrix.target }}/example.bin" "$chip"
