# udsota's CI: everything the root CMakeLists.txt builds and tests, on gcc and clang, plus what a build file cannot
# say. The client's tests run alone and against both servers (over a pipe, and on vcan0 for udsota_lite_server). The
# boot core is cross-compiled for Cortex-M3 under a size gate. The CANDash example is built four ways with a throwaway
# signing key, and with release-assets.yml the assets a release of this commit would carry. Every image build fails
# on a compiler warning, and every image must pass udsota's image rules (tools/image_check.c) and fail them with its
# descriptor broken.
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  # Every test, with udsota_lite_server built without delta downloads, and with clang the fuzzer's libFuzzer build too.
  host:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: The vendored iso14229 files match iso14229/SHA256SUMS
        run: cd iso14229 && sha256sum -c SHA256SUMS
      - name: The vendored detools files match detools/SHA256SUMS
        run: cd detools && sha256sum -c SHA256SUMS
      - name: The host tests, test_udsota_delta, the fuzzer's delta seeds and the bootloader core's tests among them
        run: |
          # udsota_lite_server is built without delta downloads here, so its sources compile that way under -Werror too.
          cmake -S . -B build -DUDSOTA_DELTA=OFF -DUDSOTA_FUZZ_LIBFUZZER="$FUZZ_LIBFUZZER"
          # One command a line: bash -e does not stop at a failure on the left of an && that is not the last command,
          # so a failed build would fall through to the check below and pass.
          cmake --build build -j
          ctest --test-dir build --output-on-failure
          # CMake leaves test_headers_cxx out when it finds no C++ compiler; here it must be there.
          ctest --test-dir build -N -R '^test_headers_cxx$' | grep -q 'Total Tests: 1'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cc == 'clang' && 'clang++' || 'g++' }}
          FUZZ_LIBFUZZER: ${{ matrix.cc == 'clang' && 'ON' || 'OFF' }}
  # The client's tests without a server, so its end-to-end files only skip here; e2e runs them.
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install "./client[diff]" pytest && python -m pytest -q client/tests
      - name: The release tool's tests (they fail unless CHANGELOG and udsota.h agree with the client's __version__)
        run: python -m pytest -q tools/test_release.py && python tools/release.py notes v0.14.2 > /dev/null
      - name: Smoke-test the installed client from outside the tree
        run: cd /tmp && python -c "from udsota import profile; print(profile.load('example'))"
  # The client against both servers, the lite one built with delta downloads.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    env:
      UDSOTA_LITE_SERVER: ${{ github.workspace }}/build/udsota_lite_server
      UDSOTA_BOOT_SERVER: ${{ github.workspace }}/build/udsota_boot_server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: |
          cmake -S . -B build
          cmake --build build -j --target udsota_lite_server udsota_boot_server
          test -x build/udsota_lite_server && test -x build/udsota_boot_server
        env:
          CC: ${{ matrix.cc }}
      - run: |
          python -m pip install "./client[diff]" pytest
          python -m pytest -q -rsx client/tests/test_e2e_lite.py client/tests/test_e2e_boot.py
      - name: Set up vcan0
        run: |
          if ! sudo modprobe vcan; then
            sudo apt-get update
            sudo apt-get install -y linux-modules-extra-$(uname -r)
            sudo modprobe vcan
          fi
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0
      - name: Load the kernel ISO-TP module, where the kernel has one (the udsota command's tests need it)
        continue-on-error: true
        run: sudo modprobe can-isotp
      - name: Run the end-to-end tests on vcan0 (UDSOTA_VCAN makes a missing vcan fail, not skip)
        run: python -m pytest -q -rsx client/tests/test_e2e_lite_vcan.py
        env:
          UDSOTA_VCAN: vcan0
  # The boot core's size, which the unit tests do not see.
  boot-arm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the distribution's arm-none-eabi-gcc and newlib
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: The bootloader core compiles for Cortex-M3 with every warning an error, and its text stays under the gate
        run: |
          arm-none-eabi-gcc --version | head -n 1
          cmake -S . -B build
          cmake --build build --target udsota_boot_arm_size
  # The ESP-IDF builds, which CMake's host build cannot run.
  esp32:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the CANDash example for the ws43, the ws43b, the ws43 at -O2 and with delta, failing on any warning
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          mkdir -p examples/candash_ws43/secrets
          espsecure.py generate_signing_key --version 2 examples/candash_ws43/secrets/dev_signing_key.pem
          p="$PWD/examples/candash_ws43"
          build() {   # build <dir> [idf.py options...], logged to <dir>.log
            d="$1"; shift
            idf.py -C examples/candash_ws43 -B "$d" "$@" build 2>&1 | tee "$d.log"
            if grep -E 'warning:' "$d.log"; then exit 1; fi   # a bare `! grep` gates the step only while it is last
          }
          build build
          build build-ws43b -DPOC_BOARD=ws43b
          # -O2, as CANDash ships: its own sdkconfig, because the ws43 build wrote the project's and defaults never
          # override an option an sdkconfig already sets.
          build build-o2 -D SDKCONFIG="$PWD/build-o2/sdkconfig" -D SDKCONFIG_DEFAULTS="$p/sdkconfig.defaults;$p/sdkconfig.defaults.o2"
          grep -qx 'CONFIG_COMPILER_OPTIMIZATION_PERF=y' build-o2/sdkconfig || { echo "build-o2 is not -O2"; exit 1; }
          # Delta downloads: UDSOTA_DELTA=1 build-wide, so detools.c is compiled under the same warning gate.
          build build-delta -DPOC_DELTA=1
          grep -q 'detools\.c' build-delta/compile_commands.json || { echo "build-delta has no detools.c"; exit 1; }
      - name: Collect the images for image-check
        run: |
          mkdir -p out
          cp build/candash.bin out/candash-ws43.bin
          cp build-ws43b/candash.bin out/candash-ws43b.bin
          cp build-o2/candash.bin out/candash-ws43-o2.bin
          cp build-delta/candash.bin out/candash-ws43-delta.bin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candash
          path: out/*
  # What a release of this commit would carry, built warning-free before any tag exists.
  release-assets:
    uses: ./.github/workflows/release-assets.yml
    with:
      ref: ${{ github.sha }}
      fail_on_warning: true
  # udsota's image rules on the images the two jobs above built.
  image-check:
    needs: [esp32, release-assets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: images
          merge-multiple: true
      - name: Each image passes udsota's image rules, and fails them with its descriptor's magic broken
        shell: bash
        run: |
          cmake -S . -B build
          cmake --build build -j --target image_check_example_esp32 image_check_example_esp32s3 image_check_ws43 \
                                        image_check_ws43b
          check() {   # check <image_check_ suffix> <image> <product>
            "build/image_check_$1" "images/$2.bin" "$3"
            cp "images/$2.bin" broken.bin
            printf '\0' | dd of=broken.bin bs=1 seek=288 conv=notrunc status=none
            rc=0; "build/image_check_$1" broken.bin "$3" || rc=$?
            [ "$rc" = 3 ] || { echo "$2 with a broken descriptor gave $rc, not 3 (UDSOTA_DL_BAD_BOARD)"; exit 1; }
          }
          check example_esp32 example-esp32 example
          check example_esp32s3 example-esp32s3 example
          check ws43 candash-ws43 candash
          check ws43b candash-ws43b candash
          check ws43 candash-ws43-o2 candash
          check ws43 candash-ws43-delta candash
