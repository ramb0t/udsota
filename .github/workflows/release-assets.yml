# Builds what a Release carries, at one commit: the client's wheel and sdist and the example's app image for esp32s3
# and esp32. release.yml calls it (workflow_call) with the tagged commit before it publishes; a CI workflow can call it
# with its own commit, so the assets a tag would release are built before the tag exists. Each job uploads its files
# as an artifact of the calling run: client, example-esp32s3 and example-esp32. Actions are pinned by commit, since
# release.yml publishes what these jobs build.
name: release assets

on:
  workflow_call:
    inputs:
      ref:
        description: "The commit to build"
        type: string
        required: true

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build the client's wheel and sdist
        run: |
          python -m pip install build
          python -m build client --outdir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: client
          path: dist/*

  esp32:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    strategy:
      matrix:
        target: [esp32s3, esp32]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - name: Build the example's app image for ${{ matrix.target }}
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          b="$PWD/examples/esp32/build/${{ matrix.target }}"
          idf.py -C examples/esp32 -B "$b" -D SDKCONFIG="$b/sdkconfig" set-target ${{ matrix.target }} build
          mkdir -p out && cp "$b/example.bin" "out/example-${{ matrix.target }}.bin"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: example-${{ matrix.target }}
          path: out/*
