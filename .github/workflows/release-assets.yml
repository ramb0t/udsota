# Builds what a Release carries, at one commit: the client's wheel and sdist and the example's app image for esp32s3
# and esp32. release.yml calls it (workflow_call) with the tagged commit before it publishes; ci.yml calls it with its
# own commit, so the assets a tag would release are built before the tag exists. With fail_on_warning set, which both
# do, an image build that prints a compiler warning fails, and udsota's image rules run on the example's images (they
# must pass, and fail with the descriptor's magic broken). release.yml sets it off only for a backfill, whose commit
# may predate those gates. Each build job uploads its files as an artifact of the calling run: client, example-esp32s3
# and example-esp32. Actions are pinned by commit, since release.yml publishes what these jobs build.
name: release assets

on:
  workflow_call:
    inputs:
      ref:
        description: "The commit to build"
        type: string
        required: true
      fail_on_warning:
        description: "Fail an image build that prints a compiler warning, and check the example's images"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build the client's wheel and sdist
        run: |
          python -m pip install build==1.6.1
          python -m build client --outdir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: client
          path: dist/*

  esp32:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    strategy:
      matrix:
        target: [esp32s3, esp32]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - name: Build the example's app image for ${{ matrix.target }}
        shell: bash
        env:
          FAIL_ON_WARNING: ${{ inputs.fail_on_warning }}
        run: |
          . "$IDF_PATH/export.sh"
          b="$PWD/examples/esp32/build/${{ matrix.target }}"
          mkdir -p "${b%/*}"   # tee opens $b.log before idf.py has made the build tree
          idf.py -C examples/esp32 -B "$b" -D SDKCONFIG="$b/sdkconfig" set-target ${{ matrix.target }} build 2>&1 | tee "$b.log"
          # a bare `! grep` gates the step only while it is the last line
          if [ "$FAIL_ON_WARNING" = true ] && grep -E 'warning:' "$b.log"; then exit 1; fi
          mkdir -p out && cp "$b/example.bin" "out/example-${{ matrix.target }}.bin"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: example-${{ matrix.target }}
          path: out/*

  # udsota's image rules on the example's images, as ci.yml's image-check does for CANDash's.
  image-check:
    if: ${{ inputs.fail_on_warning }}
    needs: esp32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: images
          merge-multiple: true
      - name: Each image passes udsota's image rules, and fails them with its descriptor's magic broken
        shell: bash
        run: |
          cmake -S . -B build
          cmake --build build -j --target image_check_example_esp32 image_check_example_esp32s3
          check() {   # check <image_check_ suffix> <image> <product>
            "build/image_check_$1" "images/$2.bin" "$3"
            cp "images/$2.bin" broken.bin
            printf '\0' | dd of=broken.bin bs=1 seek=288 conv=notrunc status=none
            rc=0; "build/image_check_$1" broken.bin "$3" || rc=$?
            [ "$rc" = 3 ] || { echo "$2 with a broken descriptor gave $rc, not 3 (UDSOTA_DL_BAD_BOARD)"; exit 1; }
          }
          check example_esp32 example-esp32 example
          check example_esp32s3 example-esp32s3 example
