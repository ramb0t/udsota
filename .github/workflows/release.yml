# Publishes a GitHub Release (see RELEASING.md). Pushing a vX.Y.Z tag on main checks that the tag, the dated
# CHANGELOG section and the client's __version__ agree, builds the client and the example's app images at the
# tag, and publishes them with the CHANGELOG section as the notes. Run it by hand (workflow_dispatch) to release
# an existing tag that has no Release yet; with backfill set it skips the version check and takes the notes from
# main's CHANGELOG. cut-release.yml calls it (workflow_call) for the tag it pushes, since a tag pushed with a
# workflow's token starts no workflow. It never creates or moves a tag. Actions are pinned by commit, since this
# job publishes.
name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, vX.Y.Z"
        required: true
      backfill:
        description: "An older version: skip the version check and take the notes from main's CHANGELOG"
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      backfill:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Resolve the tag and its commit
        id: resolve
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "::error::$TAG is not vX.Y.Z"; exit 1; }
          version="${BASH_REMATCH[1]}"
          # Only an annotated tag has a peeled ^{} entry; ask origin, since checkout may rewrite a local tag.
          sha=$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)
          [ -n "$sha" ] || { echo "::error::$TAG is not an annotated tag on origin"; exit 1; }
          git merge-base --is-ancestor "$sha" origin/main || { echo "::error::$sha is not on main"; exit 1; }
          { echo "tag=$TAG"; echo "version=$version"; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"
      - name: Check the tag, the CHANGELOG and the client's __version__ agree at the tagged commit
        if: ${{ !inputs.backfill }}
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          git show "$SHA:CHANGELOG.md" > "$RUNNER_TEMP/CHANGELOG.md"
          git show "$SHA:client/udsota/__init__.py" > "$RUNNER_TEMP/__init__.py"
          python tools/release.py check "$TAG" --changelog "$RUNNER_TEMP/CHANGELOG.md" --init "$RUNNER_TEMP/__init__.py"
      - name: Release notes from main's CHANGELOG
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          git show origin/main:CHANGELOG.md > "$RUNNER_TEMP/CHANGELOG.md"
          python tools/release.py notes "$TAG" --changelog "$RUNNER_TEMP/CHANGELOG.md" > notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: notes
          path: notes.md

  client:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build the client's wheel and sdist
        run: |
          python -m pip install build
          python -m build client --outdir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: client
          path: dist/*

  esp32:
    needs: check
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    strategy:
      matrix:
        target: [esp32s3, esp32]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.check.outputs.sha }}
      - name: Build the example's app image for ${{ matrix.target }}
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          b="$PWD/examples/esp32/build/${{ matrix.target }}"
          idf.py -C examples/esp32 -B "$b" -D SDKCONFIG="$b/sdkconfig" set-target ${{ matrix.target }}
          idf.py -C examples/esp32 -B "$b" -D SDKCONFIG="$b/sdkconfig" build
          mkdir -p out && cp "$b/example.bin" "out/example-${{ matrix.target }}.bin"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: example-${{ matrix.target }}
          path: out/*

  publish:
    needs: [check, client, esp32]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # The client is attached only when the tagged commit's client is this version: a backfilled tag whose
          # client didn't change in that release would otherwise carry a wheel named for an older version.
          assets=()
          for f in artifacts/*; do
            case "${f#artifacts/}" in
              notes.md) ;;
              udsota-"$VERSION"[-.]*) assets+=("$f") ;;
              udsota-*) echo "::notice::not attaching ${f#artifacts/}: the client at $TAG is another version" ;;
              *) assets+=("$f") ;;
            esac
          done
          gh release create "$TAG" --verify-tag --title "udsota $VERSION" --notes-file artifacts/notes.md "${assets[@]}"
